<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pantau Dompetku</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💰%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/print.css">
  <script>
    /* Terapkan tema sebelum render agar tidak berkedip */
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('pd_theme') || '{}');
        var dark = t.mode === 'dark' || ((!t.mode || t.mode === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        r.dataset.theme = dark ? 'dark' : 'light';
        if (t.accent) r.style.setProperty('--primary', t.accent);
      } catch (e) {}
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="progress" class="progress-bar"></div>
  <div id="authRoot" hidden></div>

  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo"><i class="fa-solid fa-wallet"></i></div>
        <div><b>Pantau Dompetku</b><small>Keuangan pribadi</small></div>
      </div>
      <div class="space-box">
        <label class="label" for="spaceSel">Ruang aktif</label>
        <select id="spaceSel" class="select" aria-label="Ruang aktif"></select>
      </div>
      <nav class="nav" id="nav">
        <div class="nav-label">Menu</div>
        <a href="#/dashboard" data-route="dashboard"><i class="fa-solid fa-house"></i>Dashboard</a>
        <a href="#/transactions" data-route="transactions"><i class="fa-solid fa-receipt"></i>Transaksi</a>
        <a href="#/reports" data-route="reports"><i class="fa-solid fa-chart-column"></i>Laporan Bulanan</a>
        <div class="nav-label">Kelola</div>
        <a href="#/family" data-route="family"><i class="fa-solid fa-people-roof"></i>Keluarga<span class="nav-badge" id="famBadge" hidden></span></a>
        <a href="#/wallets" data-route="wallets"><i class="fa-solid fa-wallet"></i>Dompet</a>
        <a href="#/goals" data-route="goals"><i class="fa-solid fa-bullseye"></i>Target Tabungan</a>
        <a href="#/settings" data-route="settings"><i class="fa-solid fa-gear"></i>Pengaturan</a>
      </nav>
      <div class="sidebar-foot">
        <div class="user-card" id="userCard"></div>
        <div class="row between">
          <div class="conn" id="connStatus"><span class="dot"></span><span>Terhubung</span></div>
          <div class="row"><button class="btn-icon" id="themeToggle" title="Ganti tema" aria-label="Ganti tema"><i class="fa-solid fa-moon"></i></button>
          <button class="btn-icon" id="logoutBtn" title="Keluar" aria-label="Keluar"><i class="fa-solid fa-right-from-bracket"></i></button></div>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="btn-icon menu-btn" id="menuBtn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="top-actions">
          <button class="btn-icon" id="refreshBtn" title="Muat ulang data" aria-label="Muat ulang"><i class="fa-solid fa-arrows-rotate"></i></button>
          <button class="btn btn-primary desktop-only write-only" id="addTxTop"><i class="fa-solid fa-plus"></i>Transaksi</button>
        </div>
      </header>
      <main class="content" id="view"></main>
    </div>

    <nav class="bottom-nav" aria-label="Navigasi utama">
      <a href="#/dashboard" data-route="dashboard"><i class="fa-solid fa-house"></i>Beranda</a>
      <a href="#/transactions" data-route="transactions"><i class="fa-solid fa-receipt"></i>Transaksi</a>
      <button class="fab write-only" id="fabAdd" aria-label="Tambah transaksi"><i class="fa-solid fa-plus"></i></button>
      <a href="#/reports" data-route="reports"><i class="fa-solid fa-chart-column"></i>Laporan</a>
      <button class="bn" id="bnMenu"><i class="fa-solid fa-bars-staggered"></i>Menu</button>
    </nav>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <dialog id="confirmDlg" class="modal sm"></dialog>
  <div id="toasts" class="toasts"></div>
  <div id="printRoot" aria-hidden="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
